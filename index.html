<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Fire Sensitivity Generator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101015;
      --panel: #1b1b23;
      --muted: #aaaab5;
      --accent: #ff5638;
      --text: #f7f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      background: radial-gradient(ellipse at top, #30201f, var(--bg) 55%);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main { width: min(680px, 100%); margin: 0 auto; }

    header { text-align: center; margin: 18px 0 26px; }
    header .icon { font-size: 40px; }
    h1 { margin: 4px 0; font-size: clamp(26px, 6vw, 38px); }
    header p, .note { color: var(--muted); }

    .card {
      padding: 22px;
      background: var(--panel);
      border: 1px solid #34343e;
      border-radius: 18px;
      box-shadow: 0 18px 50px #0005;
    }

    label { display: block; margin-bottom: 8px; font-weight: 650; }

    .search-row { display: flex; gap: 10px; }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #41414d;
      border-radius: 10px;
      outline: none;
      background: #111116;
      color: var(--text);
      font: inherit;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button.secondary { background: #34343e; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    #result { margin-top: 18px; }
    #result[hidden] { display: none; }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 { margin: 0; font-size: 20px; }

    .settings {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .setting {
      padding: 14px;
      border-radius: 12px;
      background: #111116;
      border: 1px solid #30303a;
    }

    .setting span { display: block; color: var(--muted); font-size: 14px; }
    .setting strong { display: block; margin-top: 2px; font-size: 24px; }

    .note { margin: 16px 0 0; font-size: 13px; }
    .error { color: #ff9988; margin-top: 10px; }

    @media (max-width: 460px) {
      .card { padding: 17px; }
      .search-row { flex-direction: column; }
      .settings { grid-template-columns: 1fr 1fr; }
      .result-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="icon" aria-hidden="true">🎯</div>
      <h1>Free Fire Sensitivity</h1>
      <p>Find a starting setup for your phone</p>
    </header>

    <section class="card" aria-label="Sensitivity generator">
      <label for="device">Search your device name</label>
      <div class="search-row">
        <input id="device" list="devices" placeholder="Example: Realme C20"
               autocomplete="off">
        <datalist id="devices">
          <option value="Realme C20">
          <option value="Realme C11">
          <option value="Realme C25">
          <option value="Realme 8">
          <option value="Redmi 9A">
          <option value="Redmi Note 10">
          <option value="Samsung Galaxy A12">
          <option value="Samsung Galaxy A14">
          <option value="iPhone 11">
          <option value="iPhone 13">
        </datalist>
        <button id="generate" type="button">Generate</button>
      </div>
      <p class="hint">Can’t find your phone? Enter any device name.</p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="result" aria-live="polite" hidden>
        <div class="result-head">
          <h2 id="resultTitle"></h2>
          <button id="copy" class="secondary" type="button">Copy settings</button>
        </div>
        <div id="settings" class="settings"></div>
        <p class="note">
          These are estimated starting values, not guaranteed “perfect” settings.
          Test them in Training Ground and adjust to your preference.
        </p>
      </section>
    </section>
  </main>

  <script>
    const presets = {
      "realme c20": {
        "General": 96, "Red Dot": 91, "2x Scope": 85,
        "4x Scope": 78, "Sniper Scope": 52, "Free Look": 78
      }
    };

    const fields = [
      "General", "Red Dot", "2x Scope",
      "4x Scope", "Sniper Scope", "Free Look"
    ];

    const input = document.getElementById("device");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    let currentSettings = null;

    // Creates repeatable estimates for device names without a saved preset.
    function makeEstimate(name) {
      let hash = 0;
      for (const char of name.toLowerCase()) {
        hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
      }

      const values = {};
      fields.forEach((field, index) => {
        hash = (hash * 1664525 + 1013904223) >>> 0;
        const ranges = [
          [90, 100], [82, 98], [75, 92],
          [65, 88], [40, 65], [65, 90]
        ];
        const [min, max] = ranges[index];
        values[field] = min + (hash % (max - min + 1));
      });
      return values;
    }

    function generate() {
      const name = input.value.trim();
      if (!name) {
        error.textContent = "Enter a device name first.";
        error.hidden = false;
        result.hidden = true;
        input.focus();
        return;
      }

      error.hidden = true;
      const key = name.toLowerCase();
      currentSettings = presets[key] || makeEstimate(name);
      document.getElementById("resultTitle").textContent =
        `Suggested settings for ${name}`;

      const container = document.getElementById("settings");
      container.replaceChildren();

      for (const field of fields) {
        const card = document.createElement("div");
        card.className = "setting";

        const label = document.createElement("span");
        label.textContent = field;

        const value = document.createElement("strong");
        value.textContent = currentSettings[field];

        card.append(label, value);
        container.append(card);
      }

      result.hidden = false;
    }

    document.getElementById("generate").addEventListener("click", generate);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") generate();
    });

    document.getElementById("copy").addEventListener("click", async event => {
      if (!currentSettings) return;

      const text = Object.entries(currentSettings)
        .map(([name, value]) => `${name}: ${value}`)
        .join("\n");

      try {
        await navigator.clipboard.writeText(text);
        event.currentTarget.textContent = "Copied!";
        setTimeout(() => event.currentTarget.textContent = "Copy settings", 1400);
      } catch {
        event.currentTarget.textContent = "Copy unavailable";
        setTimeout(() => event.currentTarget.textContent = "Copy settings", 1400);
      }
    });
  </script>
</body>
</html>
